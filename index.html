<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Envíos agil y seguro</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #2971dc;
            linear-gradient(rgba(18, 15, 11, 0.78), rgba(18, 15, 11, 0.82)),
                url("imagen.css/camion-envios-.avif") center / cover fixed no-repeat;
            margin: 0;
            padding: 30px;
        }
        .contenedor {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,.12);
        }
        h1 { margin-top: 0; }
        form {
            display: grid;
            gap: 12px;
            margin-bottom: 25px;
        }
        input, textarea, button {
            padding: 11px;
            font-size: 15px;
            border-radius: 6px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }
        textarea { min-height: 90px; resize: vertical; }
        button {
            cursor: pointer;
            border: none;
            background: #2563eb;
            color: white;
        }
        button:hover { opacity: .9; }
        .cancelar { background: #6b7280; display:none; }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border-bottom: 1px solid #ddd;
            padding: 10px;
            text-align: left;
            vertical-align: top;
        }
        th { background: #f3f4f6; }
        .acciones button {
            width: auto;
            margin-right: 5px;
            padding: 7px 10px;
        }
        .editar { background: #f59e0b; }
        .eliminar { background: #dc2626; }
        #mensaje {
            margin-bottom: 15px;
            font-weight: bold;
        }
        @media (max-width: 700px) {
            body { padding: 10px; }
            .contenedor { padding: 15px; }
            table { font-size: 13px; }
        }
    </style>
</head>
<body>
<div class="contenedor">
    <h1> Envíos ajil y seguro</h1>

    <div id="mensaje"></div>

    <form id="formEnvio">
        <input type="hidden" id="id">
        <input type="text" id="destinatario" placeholder="Destinatario" required>
        <input type="text" id="direccion" placeholder="Dirección" required>
        <textarea id="descripcion" placeholder="Descripción" required></textarea>

        <button type="submit" id="btnGuardar">Crear envío</button>
        <button type="button" class="cancelar" id="btnCancelar" onclick="cancelarEdicion()">Cancelar edición</button>
    </form>

    <h2>Envíos registrados</h2>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Destinatario</th>
                <th>Dirección</th>
                <th>Descripción</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody id="tablaEnvios"></tbody>
    </table>
</div>

<script>
const API = "api.php";

function mostrarMensaje(texto, error = false) {
    const elemento = document.getElementById("mensaje");
    elemento.textContent = texto;
    elemento.style.color = error ? "#dc2626" : "#15803d";
    setTimeout(() => elemento.textContent = "", 3000);
}

async function cargarEnvios() {
    try {
        const respuesta = await fetch(API);
        const datos = await respuesta.json();

        if (!respuesta.ok || datos.error) {
            throw new Error(datos.error || "No se pudieron cargar los envíos.");
        }

        const tabla = document.getElementById("tablaEnvios");
        tabla.innerHTML = "";

        datos.forEach(envio => {
            const fila = document.createElement("tr");

            fila.innerHTML = `
                <td>${envio.id}</td>
                <td>${escapeHtml(envio.destinatario)}</td>
                <td>${escapeHtml(envio.direccion)}</td>
                <td>${escapeHtml(envio.descripcion)}</td>
                <td class="acciones">
                    <button class="editar" onclick='editarEnvio(${JSON.stringify(envio)})'>Editar</button>
                    <button class="eliminar" onclick="eliminarEnvio(${envio.id})">Eliminar</button>
                </td>
            `;

            tabla.appendChild(fila);
        });
    } catch (error) {
        mostrarMensaje(error.message, true);
    }
}

document.getElementById("formEnvio").addEventListener("submit", async function(e) {
    e.preventDefault();

    const id = document.getElementById("id").value;

    const envio = {
        destinatario: document.getElementById("destinatario").value.trim(),
        direccion: document.getElementById("direccion").value.trim(),
        descripcion: document.getElementById("descripcion").value.trim()
    };

    try {
        let respuesta;

        if (id) {
            envio.id = parseInt(id);
            respuesta = await fetch(API, {
                method: "PUT",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify(envio)
            });
        } else {
            respuesta = await fetch(API, {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify(envio)
            });
        }

        const resultado = await respuesta.json();

        if (!respuesta.ok || resultado.error) {
            throw new Error(resultado.error || "No se pudo guardar el envío.");
        }

        mostrarMensaje(resultado.mensaje);
        cancelarEdicion();
        cargarEnvios();
    } catch (error) {
        mostrarMensaje(error.message, true);
    }
});

function editarEnvio(envio) {
    document.getElementById("id").value = envio.id;
    document.getElementById("destinatario").value = envio.destinatario;
    document.getElementById("direccion").value = envio.direccion;
    document.getElementById("descripcion").value = envio.descripcion;
    document.getElementById("btnGuardar").textContent = "Actualizar envío";
    document.getElementById("btnCancelar").style.display = "block";
    window.scrollTo({top: 0, behavior: "smooth"});
}

function cancelarEdicion() {
    document.getElementById("formEnvio").reset();
    document.getElementById("id").value = "";
    document.getElementById("btnGuardar").textContent = "Crear envío";
    document.getElementById("btnCancelar").style.display = "none";
}

async function eliminarEnvio(id) {
    if (!confirm("¿Deseas eliminar este envío?")) return;

    try {
        const respuesta = await fetch(API + "?id=" + id, {method: "DELETE"});
        const resultado = await respuesta.json();

        if (!respuesta.ok || resultado.error) {
            throw new Error(resultado.error || "No se pudo eliminar el envío.");
        }

        mostrarMensaje(resultado.mensaje);
        cargarEnvios();
    } catch (error) {
        mostrarMensaje(error.message, true);
    }
}

function escapeHtml(texto) {
    const div = document.createElement("div");
    div.textContent = texto ?? "";
    return div.innerHTML;
}

cargarEnvios();
</script>
</body>
</html>
